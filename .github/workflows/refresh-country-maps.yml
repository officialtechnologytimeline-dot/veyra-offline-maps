name: Refresh country maps
on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 5 * *'
permissions:
  contents: write
concurrency:
  group: country-map-publication
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'officialtechnologytimeline-dot/veyra-offline-maps'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install fixed official map converters
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/map-python"
          "$RUNNER_TEMP/map-python/bin/pip" install --disable-pip-version-check osmium==4.3.1
          curl --fail --location --retry 2 --max-time 120 https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz -o "$RUNNER_TEMP/pmtiles.tar.gz"
          echo "3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  $RUNNER_TEMP/pmtiles.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/map-bin"
          tar -xzf "$RUNNER_TEMP/pmtiles.tar.gz" -C "$RUNNER_TEMP/map-bin" pmtiles
      - name: Build, verify, publish and update catalog
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_BIN: ${{ runner.temp }}/map-python/bin/python3
          PMTILES_BIN: ${{ runner.temp }}/map-bin/pmtiles
        run: node tools/refresh-country-maps.mjs catalog.json "$RUNNER_TEMP/map-work"
